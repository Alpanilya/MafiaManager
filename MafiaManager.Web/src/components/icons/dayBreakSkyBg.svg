<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="w-100 h-auto rounded-3 shadow-sm">
    <defs>
    <!-- Soft Sunrise Gradient -->
    <linearGradient id="sunriseSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3b2d54"></stop>
        <stop offset="35%" stop-color="#6c406f"></stop>
        <stop offset="65%" stop-color="#b8527a"></stop>
        <stop offset="85%" stop-color="#e87a74"></stop>
        <stop offset="100%" stop-color="#fbc093"></stop>
    </linearGradient>

    <!-- Sunrise Soft Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="100%" r="60%">
        <stop offset="0%" stop-color="#FFF5E1" stop-opacity="1"></stop>
        <stop offset="40%" stop-color="#FED7AA" stop-opacity="0.8"></stop>
        <stop offset="100%" stop-color="#F472B6" stop-opacity="0"></stop>
    </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="400" height="400" fill="url(#sunriseSkyGrad)" rx="16"></rect>

    <!-- Sun Glow on Horizon -->
    <circle cx="200" cy="360" r="150" fill="url(#sunGlow)"></circle>

    <!-- Rising Sun Circle -->
    <circle cx="200" cy="330" r="38" fill="#FFFDF5" opacity="0.95"></circle>

    <!-- Sunrise Rays / Light Beams -->
    <polygon points="200,330 130,0 160,0" fill="#FFFFFF" opacity="0.08"></polygon>
    <polygon points="200,330 240,0 270,0" fill="#FFFFFF" opacity="0.08"></polygon>
    <polygon points="200,330 40,50 65,30" fill="#FFFFFF" opacity="0.06"></polygon>
    <polygon points="200,330 335,30 360,50" fill="#FFFFFF" opacity="0.06"></polygon>

    <!-- Minimal Soft Morning Clouds Tinted in Rose/Gold -->
    <!-- Top Left Cloud -->
    <path d="M 50 140 a 20 20 0 0 1 35 -10 a 28 28 0 0 1 50 5 a 18 18 0 0 1 20 20 H 40 a 15 15 0 0 1 10 -25 Z" fill="#FFD1DC" opacity="0.6"></path>

    <!-- Mid Right Cloud -->
    <path d="M 220 180 a 22 22 0 0 1 40 -12 a 32 32 0 0 1 55 6 a 20 20 0 0 1 22 22 H 210 a 16 16 0 0 1 10 -16 Z" fill="#FFE4E1" opacity="0.75"></path>

    <!-- Lower Left Floating Morning Cloud -->
    <path d="M 90 250 a 16 16 0 0 1 28 -8 a 24 24 0 0 1 40 4 a 14 14 0 0 1 15 16 H 80 a 12 12 0 0 1 10 -12 Z" fill="#FFF0F5" opacity="0.85"></path>

    <!-- Fading Morning Stars in Upper Atmosphere -->
    <circle cx="80" cy="50" r="1.5" fill="#FFFFFF" opacity="0.6"></circle>
    <circle cx="320" cy="40" r="1.5" fill="#FFFFFF" opacity="0.5"></circle>
    <circle cx="210" cy="30" r="1" fill="#FFFFFF" opacity="0.7"></circle>
</svg>