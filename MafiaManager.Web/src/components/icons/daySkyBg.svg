<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 400 400"
class="w-100 h-auto rounded-3 shadow-sm"
>
  <defs>
    <linearGradient id="daySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2"></stop>
      <stop offset="100%" stop-color="#73c2fb"></stop>
    </linearGradient>
    <filter id="softShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="4"
        flood-color="#1e3a8a"
        flood-opacity="0.15"
      ></feDropShadow>
    </filter>
  </defs>

  <!-- Blue Sky Background -->
  <rect width="400" height="400" fill="url(#daySky)" rx="16"></rect>

  <!-- Upper Right Cloud -->
  <g filter="url(#softShadow1)" opacity="0.95">
    <path
      d="M 230 100 a 25 25 0 0 1 45 -15 a 35 35 0 0 1 60 8 a 22 22 0 0 1 25 27 H 220 a 18 18 0 0 1 10 -35 Z"
      fill="#FFFFFF"
    ></path>
  </g>

  <!-- Main Left Fluffy Cloud -->
  <g filter="url(#softShadow1)">
    <path
      d="M 70 170 a 35 35 0 0 1 60 -20 a 45 45 0 0 1 80 10 a 30 30 0 0 1 40 35 a 20 20 0 0 1 -20 25 H 60 a 25 25 0 0 1 10 -50 Z"
      fill="#FFFFFF"
    ></path>
  </g>

  <!-- Mid Right Cloud -->
  <g filter="url(#softShadow1)" opacity="0.92">
    <path
      d="M 210 220 a 20 20 0 0 1 35 -10 a 28 28 0 0 1 45 5 a 18 18 0 0 1 20 20 H 200 a 15 15 0 0 1 10 -30 Z"
      fill="#FFFFFF"
    ></path>
  </g>

  <!-- Lower Small Cloud -->
  <g filter="url(#softShadow1)" opacity="0.88">
    <path
      d="M 140 280 a 12 12 0 0 1 22 -6 a 18 18 0 0 1 28 3 a 12 12 0 0 1 12 13 H 130 a 10 10 0 0 1 10 -20 Z"
      fill="#FFFFFF"
    ></path>
  </g>
</svg>
