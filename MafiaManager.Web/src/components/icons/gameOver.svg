<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Темно-синий ночной фон -->
  <rect width="700" height="250" fill="#0A0E23" rx="10" />

  <!-- Шаблоны звезд -->
  <defs>
    <!-- Крупная звезда для узлов букв -->
    <g id="star-main">
      <polygon points="0,-7 2.1,-2.1 7,-2.1 3.2,0.9 4.4,5.7 0,2.8 -4.4,5.7 -3.2,0.9 -7,-2.1 -2.1,-2.1" fill="#FFFDE7" />
    </g>
    <!-- Яркая акцентная звезда -->
    <g id="star-accent">
      <polygon points="0,-9 2.7,-2.7 9,-2.7 4.1,1.1 5.6,7.3 0,3.6 -5.6,7.3 -4.1,1.1 -9,-2.7 -2.7,-2.7" fill="#FFFFFF" />
    </g>
    <!-- Мелкая фоновая звезда -->
    <g id="star-bg">
      <polygon points="0,-3 0.9,-0.9 3,-0.9 1.4,0.4 1.9,2.5 0,1.2 -1.9,2.5 -1.4,0.4 -3,-0.9 -0.9,-0.9" fill="#FFFFFF" opacity="0.4" />
    </g>
  </defs>

  <!-- Фоновые мелкие звезды -->
  <use href="#star-bg" x="180" y="30" />
  <use href="#star-bg" x="520" y="25" />
  <use href="#star-bg" x="650" y="35" />
  <use href="#star-bg" x="40" y="220" />
  <use href="#star-bg" x="380" y="235" />
  <use href="#star-bg" x="640" y="215" />

  <!-- Луна в ЛЕВОМ ВЕРХНЕМ УГЛУ -->
  <g transform="translate(45, 45)">
    <path d="M -15 -25 A 25 25 0 1 0 10 22 A 28 28 0 1 1 -15 -25 Z" fill="#FFFDE7" opacity="0.95" />
    <path d="M 16 -10 Q 16 -2 23 -2 Q 16 -2 16 6 Q 16 -2 9 -2 Q 16 -2 16 -10 Z" fill="#FFFFFF" />
  </g>

  <!-- Контрастные линии созвездия (ОТЦЕНТРИРОВАНО ПО ЦЕНТРУ X = 350, Y = 125) -->
  <g stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="4,4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" fill="none">
    <!-- G -->
    <path d="M 95 70 L 45 70 L 45 180 L 95 180 L 95 130 L 70 130" />
    <!-- A -->
    <path d="M 115 180 L 140 70 L 165 180 M 124 140 L 156 140" />
    <!-- M -->
    <path d="M 185 180 L 185 70 L 210 120 L 235 70 L 235 180" />
    <!-- E -->
    <path d="M 290 70 L 255 70 L 255 180 L 290 180 M 255 125 L 285 125" />

    <!-- O -->
    <path d="M 320 70 L 365 70 L 365 180 L 320 180 Z" />
    <!-- V -->
    <path d="M 385 70 L 410 180 L 435 70" />
    <!-- E -->
    <path d="M 490 70 L 455 70 L 455 180 L 490 180 M 455 125 L 485 125" />
    <!-- R -->
    <path d="M 510 180 L 510 70 L 545 70 L 545 125 L 510 125 M 528 125 L 545 180" />
    <!-- ! -->
    <path d="M 575 70 L 575 145 M 575 175 L 575 180" />
  </g>

  <!-- Крупные звезды-узлы букв -->
  <g>
    <!-- G -->
    <use href="#star-main" x="95" y="70" />
    <use href="#star-main" x="45" y="70" />
    <use href="#star-main" x="45" y="180" />
    <use href="#star-main" x="95" y="180" />
    <use href="#star-main" x="95" y="130" />
    <use href="#star-main" x="70" y="130" />

    <!-- A -->
    <use href="#star-main" x="115" y="180" />
    <use href="#star-accent" x="140" y="70" />
    <use href="#star-main" x="165" y="180" />
    <use href="#star-main" x="124" y="140" />
    <use href="#star-main" x="156" y="140" />

    <!-- M -->
    <use href="#star-main" x="185" y="180" />
    <use href="#star-main" x="185" y="70" />
    <use href="#star-accent" x="210" y="120" />
    <use href="#star-main" x="235" y="70" />
    <use href="#star-main" x="235" y="180" />

    <!-- E -->
    <use href="#star-main" x="290" y="70" />
    <use href="#star-main" x="255" y="70" />
    <use href="#star-main" x="255" y="125" />
    <use href="#star-main" x="285" y="125" />
    <use href="#star-main" x="255" y="180" />
    <use href="#star-main" x="290" y="180" />

    <!-- O -->
    <use href="#star-main" x="320" y="70" />
    <use href="#star-main" x="365" y="70" />
    <use href="#star-main" x="365" y="180" />
    <use href="#star-main" x="320" y="180" />

    <!-- V -->
    <use href="#star-main" x="385" y="70" />
    <use href="#star-accent" x="410" y="180" />
    <use href="#star-main" x="435" y="70" />

    <!-- E -->
    <use href="#star-main" x="490" y="70" />
    <use href="#star-main" x="455" y="70" />
    <use href="#star-main" x="455" y="125" />
    <use href="#star-main" x="485" y="125" />
    <use href="#star-main" x="455" y="180" />
    <use href="#star-main" x="490" y="180" />

    <!-- R -->
    <use href="#star-main" x="510" y="180" />
    <use href="#star-main" x="510" y="70" />
    <use href="#star-main" x="545" y="70" />
    <use href="#star-main" x="545" y="125" />
    <use href="#star-main" x="510" y="125" />
    <use href="#star-main" x="545" y="180" />

    <!-- ! -->
    <use href="#star-accent" x="575" y="70" />
    <use href="#star-main" x="575" y="145" />
    <use href="#star-accent" x="575" y="180" />
  </g>
</svg>